"Catalog access verified.":
  ko: "목록 접근이 확인되었습니다."
"Check your connection, or sign in again to complete website verification.":
  ko: "연결을 확인하거나, 다시 로그인해 웹사이트 인증을 완료하세요."
"You can use this session until Picora quits.":
  ko: "Picora를 종료할 때까지 이 세션을 사용할 수 있습니다."
"Sign in on arca.live’s own website. When you are done, close the login window to connect the session.":
  ko: "arca.live 웹사이트에서 직접 로그인하세요. 로그인을 마치면 로그인 창을 닫아 세션을 연결합니다."
"Picora saves session cookies using OS-protected storage (Windows account encryption on Windows). Your password stays on the website.":
  ko: "Picora는 세션 쿠키를 운영체제의 보안 저장소에 보관합니다(Windows에서는 Windows 계정 암호화 사용). 비밀번호는 웹사이트에만 남습니다."
"Sign in / reconnect":
  ko: "로그인 / 다시 연결"
"Complete sign-in in the arca.live window, then close it":
  ko: "arca.live 창에서 로그인을 마친 뒤 창을 닫으세요"
"Check connection":
  ko: "연결 확인"
"Sign out":
  ko: "로그아웃"
"arca.live session removed":
  ko: "arca.live 세션을 삭제했습니다"
"Trouble signing in?":
  ko: "로그인에 문제가 있나요?"
"If the website reports a CSRF error or keeps returning to sign-in, try a fresh sign-in window. Your saved session stays in place until a new sign-in finishes.":
  ko: "웹사이트에서 CSRF 오류가 나거나 계속 로그인 화면으로 돌아가면 새 로그인 창을 열어 보세요. 새 로그인을 마칠 때까지 저장된 세션은 그대로 유지됩니다."
"Open fresh sign-in window":
  ko: "새 로그인 창 열기"
"Sign in again in the new window, then close it to reconnect.":
  ko: "새 창에서 다시 로그인한 뒤 창을 닫으면 다시 연결됩니다."
"Global shortcut":
  ko: "전역 단축키"
"Apply shortcut":
  ko: "단축키 적용"
"Use a shortcut such as Ctrl+Shift+Space":
  ko: "Ctrl+Shift+Space와 같은 형식의 단축키를 입력하세요"
"Paste automatically after choosing a sticker":
  ko: "스티커를 고르면 자동으로 붙여넣기"
"Picora never sends Enter. If input permission or focus restoration fails, paste manually.":
  ko: "Picora는 Enter 키를 보내지 않습니다. 입력 권한이나 포커스 복원에 실패하면 직접 붙여넣으세요."
"Wayland requires your desktop’s permission to send the paste shortcut.":
  ko: "Wayland에서는 붙여넣기 단축키를 보내려면 데스크톱의 권한이 필요합니다."
"Higher values load packs and previews faster. Lower it if a sticker site starts rejecting requests.":
  ko: "값이 클수록 팩과 미리보기를 빠르게 불러옵니다. 스티커 사이트가 요청을 거부하기 시작하면 값을 낮추세요."
"Original files are retained so clipboard attachments remain available.":
  ko: "클립보드 첨부를 계속 사용할 수 있도록 원본 파일을 보관합니다."
"Enable / reconnect Wayland keyboard access":
  ko: "Wayland 키보드 접근 허용 / 다시 연결"
"Approve keyboard access in the desktop dialog":
  ko: "데스크톱 대화 상자에서 키보드 접근을 허용하세요"
