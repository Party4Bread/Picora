  ko: "자동 붙여넣기 준비 완료"
"Enable automatic paste":
  ko: "자동 붙여넣기 사용"
"Permission is enabled. Switch to your chat, open Picora, and choose the sticker again.":
  ko: "권한이 허용되었습니다. 채팅으로 돌아가 Picora를 열고 스티커를 다시 선택하세요."
"The previous sticker will not be pasted automatically.":
  ko: "이전에 고른 스티커는 자동으로 붙여넣지 않습니다."
"Your sticker is copied. You can paste it now with Cmd+V, or finish setup below.":
  ko: "스티커가 복사되었습니다. 지금 Cmd+V로 붙여넣거나, 아래에서 설정을 마치세요."
"1. Open Accessibility settings using the button below.":
  ko: "1. 아래 버튼으로 손쉬운 사용 설정을 엽니다."
"2. Turn on Picora in the app list. If it is missing, click + and select Picora.app in Applications.":
  ko: "2. 앱 목록에서 Picora를 켭니다. 목록에 없으면 +를 클릭하고 응용 프로그램 폴더의 Picora.app을 선택합니다."
"3. Return to Picora. This panel checks permission automatically.":
  ko: "3. Picora로 돌아옵니다. 이 화면에서 권한을 자동으로 확인합니다."
"macOS may still be allowing an older Picora build. This can happen once after updating from an older version. Remove Picora from the Accessibility list with −, add the current Picora.app with +, and turn it on. Then quit and reopen Picora.":
  ko: "macOS가 이전 Picora 빌드에 권한을 주고 있을 수 있습니다. 이전 버전에서 업데이트한 뒤 한 번 발생할 수 있습니다. 손쉬운 사용 목록에서 −로 Picora를 제거하고, +로 현재 Picora.app을 추가한 뒤 켜세요. 그런 다음 Picora를 종료했다가 다시 여세요."
"Keep Picora in Applications. If you run it from source, macOS may list your terminal or launcher instead.":
  ko: "Picora는 응용 프로그램 폴더에 두세요. 소스에서 실행하면 macOS가 Picora 대신 터미널이나 실행기를 목록에 표시할 수 있습니다."
"Back to my library":
  ko: "내 라이브러리로 돌아가기"
"Open Accessibility settings":
  ko: "손쉬운 사용 설정 열기"
"Could not open System Settings: %{error}. Open Privacy & Security → Accessibility manually.":
  ko: "시스템 설정을 열 수 없습니다: %{error}. 개인정보 보호 및 보안 → 손쉬운 사용을 직접 여세요."
"Picora is already enabled, but it still does not work":
  ko: "Picora를 이미 켰는데도 동작하지 않나요?"
"Use manual paste instead":
  ko: "직접 붙여넣기 사용"
"Automatic paste is off. Copy a sticker, then press Cmd+V in your chat.":
  ko: "자동 붙여넣기를 껐습니다. 스티커를 복사한 뒤 채팅에서 Cmd+V를 누르세요."
