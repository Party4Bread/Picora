name: Rust desktop
on:
  push:
    # Feature branches run through pull_request; tags run through release.yml.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Use a distinct prefix from release.yml: reusable workflows inherit the
# caller's github.workflow, and must never cancel their own release caller.
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check for build changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          event, ref = os.environ['EVENT'], os.environ['REF']
          base, head = os.environ['BASE'], os.environ['HEAD']
          build = True
          if event in ('pull_request', 'push') and not ref.startswith('refs/tags/') and base.strip('0'):
              if event == 'pull_request':
                  base = subprocess.check_output(['git', 'merge-base', base, head], text=True).strip()
              paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', base, head]).split(b'\0')
              def documentation(path):
                  return (path.startswith(b'docs/') and path.endswith(b'.md')) or (
                      b'/' not in path and path.endswith(b'.md') and (
                          path == b'README.md' or path.startswith(b'README-')
                      )
                  )
              build = any(path and not documentation(path) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(build).lower()}\n')
          print('Desktop build required' if build else 'Documentation-only change: desktop builds skipped')
          PYTHON
  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, tomllib
          version = tomllib.loads(open('Cargo.toml').read())['package']['version']
          version += f"-dev.{os.environ['GITHUB_RUN_ID']}.g{os.environ['GITHUB_SHA'][:12]}"
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PICORA_BUILD_VERSION={version}\n')
          PYTHON
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs and tags restore main's cache, without filling the cache quota
          # with private copies. Failed/partial builds must not seed empty caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libx11-dev libxrandr-dev libxi-dev libxdo-dev libgl1-mesa-dev libdbus-1-dev libxkbcommon-x11-0 xvfb xauth
      # These checks are platform-independent; run once per matrix.
      - if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts -p test_update_manifest.py
          python -m unittest discover -s scripts -p test_prune_dev_releases.py
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Load macOS signing certificate
        if: runner.os == 'macOS'
        env:
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          # Published builds must keep the same certificate, or macOS drops
          # users' Accessibility permission. Fork PRs have no secrets and use
          # an ad-hoc signature.
          if [ -z "$SIGNING_P12" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::MACOS_SIGNING_P12 is required for published macOS builds"
              exit 1
            fi
            echo "No signing certificate available; using an ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/picora-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/picora-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/picora-signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/picora-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The self-signed certificate is not trusted, so select it by hash.
          identity=$(security find-certificate -c "Picora Release Signing" -Z "$keychain" | awk '/SHA-1 hash:/ {print $3; exit}')
          test -n "$identity"
          echo "PICORA_MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "PICORA_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package desktop build
        run: python scripts/package.py
      - name: Verify macOS bundle and packaged launch
        if: runner.os == 'macOS'
        run: |
          python scripts/test_macos_package.py dist/*-macos-*.zip
          hdiutil verify dist/*-macos-*.dmg
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Download published update baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) pattern='*-linux-x86_64.tar.gz' ;;
            Windows) pattern='*-windows-x86_64.zip' ;;
            macOS) pattern='*-macos-aarch64.zip' ;;
          esac
          gh release download --repo Party4Bread/Picora --pattern "$pattern" --dir target/update-baseline
      - name: Provide software OpenGL on the Windows runner
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3
        with:
          version: '26.0.3'
      - name: Test packaged application replacement and restart
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/test_packaged_update.py --baseline target/update-baseline
          else
            python scripts/test_packaged_update.py --baseline target/update-baseline
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: picora-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          # Archives/installers are compressed already. Releases copy these assets
          # to permanent release storage before the short CI retention expires.
          compression-level: 0
          retention-days: 7

  publish-dev:
    needs: [changes, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: picora-*
          path: dist
          merge-multiple: true
      - name: Publish tested development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 - <<'PYTHON'
          import os, tomllib
          version = tomllib.loads(open('Cargo.toml').read())['package']['version']
          print(f"{version}-dev.{os.environ['GITHUB_RUN_ID']}.g{os.environ['GITHUB_SHA'][:12]}")
          PYTHON
          )
          tag="v$version"
          python3 scripts/update_manifest.py --tag "$tag" --dev-version "$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/picora-release-draft; then
            if [ "$(cat /tmp/picora-release-draft)" = "false" ]; then
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "Dev $version" --notes "Development build from main commit $GITHUB_SHA. All platform CI checks passed. May contain unfinished changes."
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
