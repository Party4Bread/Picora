[package]
name = "picora"
version = "0.1.0"
edition = "2024"
description = "A cross-platform sticker picker for DCInside and Arca"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
egui_extras = { version = "0.33", features = ["image"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = { version = "2", features = ["serde"] }
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
sha2 = "0.10"
hex = "0.4"
clipboard-rs = "0.3"
global-hotkey = "0.7"
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }
tray-icon = "0.21"
wry = "0.53"
tao = "0.34"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
interprocess = "2"
fs2 = "0.4"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
gtk = "0.18"
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Cryptography"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
strip = true

# eframe 0.33 does not update hidden Windows windows. Keep the upstream
# fix locally until the app migrates to the newer egui App/UI API.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
