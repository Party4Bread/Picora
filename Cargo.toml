[package]
name = "picora"
version = "0.1.7"
edition = "2024"
description = "Desktop sticker picker for Windows, macOS, and Linux"
repository = "https://github.com/Party4Bread/Picora"
readme = "README.md"
keywords = ["stickers", "clipboard", "desktop", "picker", "egui"]
categories = ["gui"]

[dependencies]
semver = "1"
rand = "0.9"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
anyhow = "1"
futures-util = "0.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = { version = "2", features = ["serde"] }
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
sha2 = "0.10"
hex = "0.4"
clipboard-rs = "0.3"
global-hotkey = "0.7"
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }
tray-icon = "0.21"
wry = "0.53"
tao = "0.34"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
interprocess = "2"
fs2 = "0.4"
open = "5"
tempfile = "3"
mp4 = "0.14"
openh264 = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
gtk = "0.18"
x11rb = { version = "0.13", features = ["xtest"] }
wl-clipboard-rs = "0.9.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }

[dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
lto = "thin"
strip = true

# eframe 0.33 does not update hidden Windows windows. Keep the upstream
# fix locally until the app migrates to the newer egui App/UI API.
[patch.crates-io]
eframe = { path = "vendor/eframe" }

[[test]]
name = "update_process"
harness = false
